<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancha 19 – Fútbol web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root{--bg:#0e1a14;--panel:#16271e;--ink:#f2f6f1;--mute:#8fa597;--a:#2f7bff;--b:#ff8a2a;--ok:#c8f169;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#hud{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 10px;font-weight:800;font-size:26px}
#hud .t{font-size:15px;color:var(--mute);font-weight:600;min-width:64px;text-align:center}
#hud .n{font-size:15px;font-weight:600}
#hud .s{background:var(--panel);padding:2px 14px;border-radius:8px;letter-spacing:2px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{width:min(100vw,calc((100dvh - 230px)*1.64));max-width:100%;aspect-ratio:1050/640;background:#2d8a4a;border-radius:6px}
#ctl{height:150px;display:flex;justify-content:space-between;align-items:center;padding:0 22px 8px}
#joy{width:120px;height:120px;border-radius:50%;background:var(--panel);border:2px solid #284a38;position:relative}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#3b5f4b}
#btns{display:flex;gap:12px;align-items:flex-end}
.b{width:78px;height:78px;border-radius:50%;border:0;color:var(--ink);font:800 17px "Barlow Condensed",sans-serif;background:var(--panel);box-shadow:inset 0 0 0 2px #284a38}
.b.on{background:#284a38}
#shoot{width:96px;height:96px;background:var(--b);color:#1a0d00;font-size:22px;box-shadow:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,16,12,.86);text-align:center;padding:20px}
#ov h1{font-size:54px;margin:0;font-weight:800;line-height:1}
#ov p{margin:0;color:var(--mute);font-size:18px;max-width:420px;line-height:1.25;font-weight:600}
#go{background:var(--ok);color:#10200a;border:0;border-radius:10px;font:800 24px "Barlow Condensed",sans-serif;padding:10px 36px;margin-top:6px}
#msg{position:absolute;top:38%;left:0;right:0;text-align:center;font-weight:800;font-size:64px;pointer-events:none;text-shadow:0 3px 12px #000}
</style>
</head>
<body>
<div id="hud"><span class="n" style="color:var(--a)">Tú</span><span class="s" id="sc">0 – 0</span><span class="n" style="color:var(--b)">Rival</span><span class="t" id="tm">0’</span></div>
<div id="stage">
  <canvas id="cv" width="2100" height="1280"></canvas>
  <div id="msg"></div>
  <div id="ov"><h1>Cancha 19</h1><p>Fútbol 5 contra 5 en tu navegador. Atacas hacia la derecha. Partido de 90 minutos acelerados.</p><p>Móvil: joystick, Pase (sin balón cambia de jugador), Tiro (mantén para más fuerza) y Correr.<br>Teclado: flechas o WASD, X pase o cambiar jugador, Espacio tiro, Shift correr.</p><button id="go">Jugar</button></div>
</div>
<div id="ctl">
  <div id="joy"><div id="knob"></div></div>
  <div id="btns"><button class="b" id="run">Correr</button><button class="b" id="pass">Pase</button><button class="b" id="shoot">Tiro</button></div>
</div>
<script>
const W=1050,H=640,GY1=250,GY2=390,DUR=120;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FORM=[[.04,.5,1],[.22,.3,0],[.22,.7,0],[.44,.27,0],[.44,.73,0]];
let P,ball,score,clock,state,timer,holder,input={x:0,y:0,run:false},charge=-1,passReq=false,ctrl;
const keys={};

function mk(team,i){const f=FORM[i];return{team,gk:!!f[2],i,x:0,y:0,vx:0,vy:0,fx:team?-1:1,fy:0,fx0:f[0],fy0:f[1],cd:0,tcd:0,hold:0}}
function home(p){const s=p.gk?0:(ball.x-W/2)*.3;const bx=p.team?(1-p.fx0)*W-s:p.fx0*W+s;return[bx,p.fy0*H]}
function kickoff(){
  ball={x:W/2,y:H/2,vx:0,vy:0};holder=null;
  P.forEach(p=>{const h=home(p);p.x=h[0];p.y=h[1];p.vx=p.vy=0;p.cd=0;p.tcd=0});
}
function start(){
  P=[];for(let t=0;t<2;t++)for(let i=0;i<5;i++)P.push(mk(t,i));
  score=[0,0];clock=0;state='play';timer=0;ball={x:W/2,y:H/2,vx:0,vy:0};kickoff();ctrl=P[3];
  $('ov').style.display='none';$('msg').textContent='';upd();
}
function upd(){$('sc').textContent=score[0]+' – '+score[1];$('tm').textContent=Math.min(90,Math.floor(clock/DUR*90))+'’'}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function kick(p,dx,dy,sp){
  const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  holder=null;ball.x=p.x+dx*20;ball.y=p.y+dy*20;ball.vx=dx*sp;ball.vy=dy*sp;p.cd=.35;p.fx=dx;p.fy=dy;
}
function doPass(p){
  let dx=p.team?0:input.x,dy=p.team?0:input.y;const has=Math.hypot(dx,dy)>.2;
  if(!has){dx=p.fx;dy=p.fy}
  const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  let best=null,bs=-9;
  P.forEach(q=>{if(q.team!==p.team||q===p)return;
    const vx=q.x-p.x,vy=q.y-p.y,d=Math.hypot(vx,vy)||1;
    let s=(vx*dx+vy*dy)/d-d/900;
    if(p.team)s=(p.team?-vx:vx)/d*.6+(-d/900)+Math.random()*.4; // rival prefiere avanzar
    if(s>bs){bs=s;best=q}});
  if(best&&!p.team&&!best.gk)ctrl=best;
  if(best){const vx=best.x+best.vx*.3-p.x,vy=best.y+best.vy*.3-p.y;kick(p,vx,vy,Math.min(620,260+Math.hypot(vx,vy)*1.1))}
  else kick(p,dx,dy,400);
}
function doShot(p,power,ay){
  const gx=p.team?0:W;kick(p,gx-p.x,ay-p.y,300+power*560);
}
function step(dt){
  if(state==='end')return;
  if(state==='goal'){timer-=dt;if(timer<=0){state='play';$('msg').textContent='';kickoff()}return}
  clock+=dt;if(clock>=DUR){state='end';finish();return}
  // input
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
  if(ix||iy){const l=Math.hypot(ix,iy);input.x=ix/l;input.y=iy/l}else if(!joyOn){input.x=0;input.y=0}
  const run=input.run||keys.Shift;
  // control
  if(holder&&holder.team===0&&!holder.gk)ctrl=holder;
  else if(!ctrl||ctrl.gk||ctrl.team!==0){switchP()}
  // chasers
  const near=[0,0].map(t=>{let b=null,bd=1e9;P.forEach(p=>{if(p.team===t&&!p.gk){const d=dist(p,ball);if(d<bd){bd=d;b=p}}});return b});
  P.forEach(p=>{
    p.cd-=dt;p.tcd-=dt;
    let tx=p.x,ty=p.y,sp=135,mx=null,my=null;
    if(p===ctrl){mx=input.x;my=input.y;sp=run?205:150}
    else if(p.gk){
      const h=home(p);tx=h[0];ty=Math.max(GY1+8,Math.min(GY2-8,ball.y));
      if(!holder&&Math.hypot(ball.x-p.x,ball.y-p.y)<150&&Math.abs(ball.x-(p.team?W:0))<200){tx=ball.x;ty=ball.y}
      sp=150;
      if(holder===p){p.hold+=dt;if(p.hold>.7){p.hold=0;doPass(p)}}
    }else{
      const myBall=holder&&holder.team===p.team;
      if(holder===p){ // IA con balón (rival)
        const gx=p.team?0:W;tx=gx;ty=H/2+(p.y<H/2?35:-35);sp=170;
        const dg=Math.abs(p.x-gx);
        p.hold+=dt;
        if(dg<290&&p.hold>.3){doShot(p,.5+Math.random()*.3,H/2+(Math.random()-.5)*110);p.hold=0}
        else if(p.hold>1.3&&Math.random()<.04){doPass(p);p.hold=0}
      }else if(near[p.team]===p&&!myBall){tx=ball.x+ball.vx*.25;ty=ball.y+ball.vy*.25;sp=p.team?150:140}
      else{const h=home(p);tx=h[0]+(myBall?(p.team?-70:70):0);ty=h[1]}
    }
    if(mx===null){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d>6){mx=dx/d;my=dy/d}else{mx=0;my=0}}
    p.vx+=(mx*sp-p.vx)*Math.min(1,dt*8);p.vy+=(my*sp-p.vy)*Math.min(1,dt*8);
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.x=Math.max(12,Math.min(W-12,p.x));p.y=Math.max(12,Math.min(H-12,p.y));
    if(Math.hypot(p.vx,p.vy)>20){p.fx=p.vx/Math.hypot(p.vx,p.vy);p.fy=p.vy/Math.hypot(p.vx,p.vy)}
  });
  // separación
  for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b],d=dist(A,B);if(d<22&&d>0){const k=(22-d)/2/d;A.x-=(B.x-A.x)*k;A.y-=(B.y-A.y)*k;B.x+=(B.x-A.x)*k;B.y+=(B.y-A.y)*k}}
  // balón
  if(holder){ball.x=holder.x+holder.fx*17;ball.y=holder.y+holder.fy*17;ball.vx=holder.vx;ball.vy=holder.vy;
    P.forEach(o=>{if(o.team!==holder.team&&o.tcd<=0&&dist(o,holder)<20){o.tcd=.8;if(Math.random()<.5){holder.cd=.5;holder=o;o.hold=0}}})}
  else{
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(.5,dt);ball.vx*=f;ball.vy*=f;
    if(ball.y<0){ball.y=0;ball.vy*=-.6}if(ball.y>H){ball.y=H;ball.vy*=-.6}
    const inG=ball.y>GY1&&ball.y<GY2;
    if(ball.x<0||ball.x>W){
      if(inG){const s=ball.x>W?0:1;score[s]++;state='goal';timer=2;$('msg').textContent=s?'Gol del rival':'¡GOOOL!';$('msg').style.color=s?'var(--b)':'var(--ok)';upd();return}
      ball.x=ball.x<0?0:W;ball.vx*=-.6;
    }
    const sp=Math.hypot(ball.vx,ball.vy);
    let c=null,cd=1e9;
    P.forEach(p=>{const d=dist(p,ball);if(p.cd<=0&&d<(p.gk?24:17)&&(p.gk?sp<900:sp<380)&&d<cd){c=p;cd=d}});
    if(c){
      if(c.gk&&sp>650&&Math.random()<.3){ball.vx*=-.4;ball.vy+=(Math.random()-.5)*300;c.cd=.4}
      else{holder=c;c.hold=0}
    }
  }
  if(state==='play')upd();
}
function finish(){
  const r=score[0]>score[1]?'¡Ganaste!':score[0]<score[1]?'Perdiste':'Empate';
  $('ov').innerHTML='<h1>'+r+'</h1><p>Resultado final: '+score[0]+' – '+score[1]+'</p><button id="go">Jugar otra vez</button>';
  $('ov').style.display='flex';$('go').onclick=start;
}
function draw(){
  g.clearRect(0,0,W,H);
  for(let i=0;i<10;i++){g.fillStyle=i%2?'#2d8a4a':'#2a8044';g.fillRect(i*W/10,0,W/10,H)}
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=3;
  g.strokeRect(4,4,W-8,H-8);g.beginPath();g.moveTo(W/2,4);g.lineTo(W/2,H-4);g.stroke();
  g.beginPath();g.arc(W/2,H/2,70,0,7);g.stroke();
  g.strokeRect(4,H/2-130,130,260);g.strokeRect(W-134,H/2-130,130,260);
  g.fillStyle='rgba(255,255,255,.9)';g.fillRect(0,GY1,6,GY2-GY1);g.fillRect(W-6,GY1,6,GY2-GY1);
  const ord=[...P].sort((a,b)=>a.y-b.y);
  ord.forEach(p=>{
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(p.x,p.y+11,13,6,0,0,7);g.fill();
    g.fillStyle=p.gk?(p.team?'#ffe14a':'#9ef0ff'):(p.team?'#ff8a2a':'#2f7bff');
    g.beginPath();g.arc(p.x,p.y,13,0,7);g.fill();
    g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(p.x+p.fx*8,p.y+p.fy*8,3.5,0,7);g.fill();
    if(p===ctrl){g.strokeStyle='#c8f169';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,19,0,7);g.stroke()}
  });
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(ball.x,ball.y+7,8,4,0,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,8,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.stroke();
}
const pc=document.createElement('canvas');pc.width=W+160;pc.height=H+160;
(function(){const q=pc.getContext('2d');q.translate(80,80);
 q.fillStyle='#0d1712';q.fillRect(-80,-80,W+160,H+160);
 for(let i=0;i<3400;i++){const x=Math.random()*(W+160)-80,y=Math.random()*(H+160)-80;if(x>-26&&x<W+26&&y>-26&&y<H+26)continue;q.fillStyle='hsl('+(Math.random()*360|0)+',50%,'+(28+Math.random()*30|0)+'%)';q.fillRect(x,y,4,4)}
 q.fillStyle='#17251e';q.fillRect(-26,-26,W+52,H+52);
 for(let x=-26;x<W+26;x+=104){q.fillStyle=(x/104|0)%2?'#2a5fd0':'#e8e8e8';q.fillRect(x,-22,104,12);q.fillRect(x,H+10,104,12)}
 for(let i=0;i<14;i++){q.fillStyle=i%2?'#31924e':'#2a8344';q.fillRect(i*W/14,0,W/14,H)}
 for(let i=0;i<7000;i++){q.fillStyle='rgba(0,0,0,'+Math.random()*.05+')';q.fillRect(Math.random()*W,Math.random()*H,2,3)}
 q.strokeStyle='rgba(255,255,255,.85)';q.lineWidth=3;
 q.strokeRect(0,0,W,H);q.beginPath();q.moveTo(W/2,0);q.lineTo(W/2,H);q.stroke();
 q.beginPath();q.arc(W/2,H/2,70,0,7);q.stroke();q.fillStyle='#fff';q.beginPath();q.arc(W/2,H/2,4,0,7);q.fill();
 [0,1].forEach(s=>{const x=s?W:0,d=s?-1:1;q.strokeRect(s?W-130:0,H/2-130,130,260);q.strokeRect(s?W-50:0,H/2-70,50,140);
  q.beginPath();q.arc(x+d*90,H/2,3,0,7);q.fill();q.beginPath();q.arc(x+d*90,H/2,70,s?Math.PI*.7:-Math.PI*.3,s?Math.PI*1.3:Math.PI*.3);q.stroke();
  q.fillStyle='rgba(20,30,25,.55)';q.fillRect(s?W:-34,GY1,34,GY2-GY1);
  q.lineWidth=1;q.strokeStyle='rgba(255,255,255,.35)';for(let k=0;k<=34;k+=7){q.beginPath();q.moveTo((s?W:-34)+k,GY1);q.lineTo((s?W:-34)+k,GY2);q.stroke()}
  for(let k=GY1;k<=GY2;k+=10){q.beginPath();q.moveTo(s?W:-34,k);q.lineTo(s?W+34:0,k);q.stroke()}
  q.lineWidth=3;q.strokeStyle='rgba(255,255,255,.85)';q.fillStyle='#fff';
  q.fillRect(x-4,GY1-4,8,8);q.fillRect(x-4,GY2-4,8,8);q.fillRect(s?W:-34,GY1-2,34,3);q.fillRect(s?W:-34,GY2-1,34,3);q.fillRect(s?W+31:-34,GY1,3,GY2-GY1)});
})();
(function(){const q=pc.getContext('2d');q.setTransform(1,0,0,1,80,80);const R=38,B=50,rnd=Math.random;
 q.fillStyle='#0b120e';q.fillRect(-80,-80,W+160,H+160);
 const pal=['#c93a3a','#e8e8e8','#2f6fd6','#e0b43a','#3a3a3a','#7a3ad0','#3ab070','#d97a2a'];
 for(let x=-80;x<W+80;x+=5)for(let y=-80;y<H+80;y+=5){if(x>-B-2&&x<W+B&&y>-B-2&&y<H+B)continue;const d=Math.min(1,Math.max(-B-x,x-W-B,-B-y,y-H-B,0)/30);q.fillStyle=pal[rnd()*8|0];q.fillRect(x+rnd()*2,y+rnd()*2,4,4);q.fillStyle='rgba(0,0,0,'+(.2+d*.5)+')';q.fillRect(x,y,5,5)}
 const BC=['#1b49c9','#f0f0f0','#c92a2a','#1a1a1a'];q.fillStyle='#10161a';q.fillRect(-B-4,-B-4,W+2*B+8,H+2*B+8);
 q.font='800 9px sans-serif';q.textAlign='center';
 for(let i=0,x=-B;x<W+B;x+=105,i++){q.fillStyle=BC[i%4];q.fillRect(x,-B,105,12);q.fillRect(x,H+R,105,12);q.fillStyle=i%4==1?'#111':'#fff';q.fillText('CANCHA 19',x+52,-B+9);q.fillText('CANCHA 19',x+52,H+R+9)}
 for(let i=0,y=-B;y<H+B;y+=105,i++){q.fillStyle=BC[(i+2)%4];q.fillRect(-B,y,12,105);q.fillRect(W+R,y,12,105)}
 q.save();q.beginPath();q.rect(-R,-R,W+2*R,H+2*R);q.clip();
 const n=18,sw=(W+2*R)/n;for(let i=0;i<n;i++){q.fillStyle=i%2?'#3a9b54':'#318c49';q.fillRect(-R+i*sw,-R,sw+1,H+2*R)}
 for(let i=0;i<260;i++){const x=rnd()*(W+2*R)-R,y=rnd()*(H+2*R)-R,r=30+rnd()*90,gr=q.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.045)');gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.fillRect(x-r,y-r,2*r,2*r)}
 q.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<12000;i++)q.fillRect(rnd()*(W+2*R)-R,rnd()*(H+2*R)-R,1,4);
 q.fillStyle='rgba(0,30,0,.12)';for(let i=0;i<12000;i++)q.fillRect(rnd()*(W+2*R)-R,rnd()*(H+2*R)-R,1,4);
 [[0,H/2,95],[W,H/2,95],[W/2,H/2,65],[110,H/2,45],[W-110,H/2,45]].forEach(a=>{const gr=q.createRadialGradient(a[0],a[1],0,a[0],a[1],a[2]);gr.addColorStop(0,'rgba(125,100,55,.25)');gr.addColorStop(1,'rgba(125,100,55,0)');q.fillStyle=gr;q.fillRect(a[0]-a[2],a[1]-a[2],2*a[2],2*a[2])});
 q.restore();
 q.strokeStyle=q.fillStyle='rgba(255,255,255,.92)';q.lineWidth=3.5;
 q.strokeRect(0,0,W,H);q.beginPath();q.moveTo(W/2,0);q.lineTo(W/2,H);q.stroke();q.beginPath();q.arc(W/2,H/2,91,0,7);q.stroke();q.beginPath();q.arc(W/2,H/2,4,0,7);q.fill();
 [0,1].forEach(s=>{const x0=s?W:0,d=s?-1:1;q.strokeRect(s?W-150:0,H/2-165,150,330);q.strokeRect(s?W-50:0,H/2-95,50,190);q.beginPath();q.arc(x0+d*110,H/2,3.5,0,7);q.fill();q.beginPath();q.arc(x0+d*110,H/2,90,s?Math.PI-1.11:-1.11,s?Math.PI+1.11:1.11);q.stroke()});
 [[0,0,0,1.5708],[W,0,1.5708,3.1416],[W,H,3.1416,4.7124],[0,H,4.7124,6.2832]].forEach(a=>{q.beginPath();q.arc(a[0],a[1],14,a[2],a[3]);q.stroke()});
 [0,1].forEach(s=>{const nx=s?W:-34,x0=s?W:0;q.fillStyle='rgba(10,20,15,.6)';q.fillRect(nx,GY1,34,GY2-GY1);q.strokeStyle='rgba(255,255,255,.4)';q.lineWidth=1;

function drawBall(){
 const sp=Math.hypot(ball.vx,ball.vy);bang+=sp*.0009+.0001;
 if(sp>300)for(let i=0;i<bt.length;i++){g.fillStyle='rgba(255,255,255,'+i*.025+')';g.beginPath();g.arc(bt[i].x,bt[i].y,3+i*.4,0,7);g.fill()}
 g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(ball.x+3,ball.y+7,9,3.5,0,0,7);g.fill();
 g.save();g.translate(ball.x,ball.y-1);g.rotate(bang);g.fillStyle='#fff';g.beginPath();g.arc(0,0,8,0,7);g.fill();
 g.fillStyle='#1c1c1c';g.beginPath();for(let k=0;k<5;k++){const a=k*1.2566;g.lineTo(Math.cos(a)*3.2,Math.sin(a)*3.2)}g.fill();
 for(let k=0;k<5;k++){const a=k*1.2566+.6;g.beginPath();g.arc(Math.cos(a)*6.4,Math.sin(a)*6.4,1.6,0,7);g.fill()}
 g.strokeStyle='#999';g.lineWidth=1;g.beginPath();g.arc(0,0,8,0,7);g.stroke();g.restore();
}
function draw2(){
 tt+=1/60;const z=1.3,vw=W/z,vh=H/z;
 cam.x+=(Math.max(vw/2-130,Math.min(W-vw/2+130,ball.x+ball.vx*.15))-cam.x)*.1;
 cam.y+=(Math.max(vh/2-170,Math.min(H-vh/2+170,ball.y+ball.vy*.15))-cam.y)*.1;
 g.setTransform(S,0,0,S,0,0);g.fillStyle='#0d1712';g.fillRect(0,0,W,H);
 g.setTransform(z*S,0,0,z*S,(W/2-cam.x*z)*S,(H/2-cam.y*z)*S);
 g.drawImage(pg,-PM,-PM,W+2*PM,H+2*PM);
 const ps=P||[];
 if(P&&ctrl){g.strokeStyle='#c8f169';g.lineWidth=3;g.globalAlpha=.6+.4*Math.sin(tt*8);g.beginPath();g.ellipse(ctrl.x,ctrl.y+10,19,9,0,0,7);g.stroke();g.globalAlpha=1}
 const ord=[...ps].sort((a,b)=>a.y-b.y);let bd=false;
 ord.forEach(p=>{if(!bd&&p.y>ball.y){drawBall();bd=true}drawP(p)});if(!bd)drawBall();
 bt.push({x:ball.x,y:ball.y});if(bt.length>8)bt.shift();
 if(P&&ctrl){g.fillStyle='#c8f169';const ay=ctrl.y-30+Math.sin(tt*8)*3;g.beginPath();g.moveTo(ctrl.x-6,ay-8);g.lineTo(ctrl.x+6,ay-8);g.lineTo(ctrl.x,ay);g.fill()}
 if(state==='goal'&&pst!=='goal'){flash=.5;for(let i=0;i<160;i++)parts.push({x:cam.x+(Math.random()-.5)*vw,y:cam.y-vh/2-Math.random()*60,vx:(Math.random()-.5)*2,vy:Math.random()*2+1,r:Math.random()*6,c:'hsl('+(Math.random()*360|0)+',85%,60%)',a:0})}
 pst=state;
 parts=parts.filter(q=>q.a<260);parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.04;q.r+=.2;q.a++;g.save();g.translate(q.x,q.y);g.rotate(q.r);g.fillStyle=q.c;g.fillRect(-4,-2,8,4);g.restore()});
 g.setTransform(1,0,0,1,0,0);
 g.setTransform(S,0,0,S,0,0);if(flash>.01){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H);flash*=.92}
 const gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.globalCompositeOperation='soft-light';g.fillStyle='rgba(255,170,90,.22)';g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';
 if(GRN){if(!GRN.p)GRN.p=g.createPattern(GRN,'repeat');g.save();g.globalCompositeOperation='overlay';g.globalAlpha=.3;g.translate(Math.random()*256,Math.random()*256);g.fillStyle=GRN.p;g.fillRect(-256,-256,W+256,H+256);g.restore()}
}
let last=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(P)step(dt);draw2();chargeUI();requestAnimationFrame(loop)}
// controles
let joyOn=false;const joy=$('joy'),knob=$('knob');
function jm(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';const n=Math.hypot(dx,dy)/m;if(n<.15){input.x=input.y=0}else{input.x=dx/m/n*Math.min(1,n*1.3);input.y=dy/m/n*Math.min(1,n*1.3)}}
joy.addEventListener('pointerdown',e=>{joyOn=true;joy.setPointerCapture(e.pointerId);jm(e)});
joy.addEventListener('pointermove',e=>{if(joyOn)jm(e)});
const jend=()=>{joyOn=false;input.x=input.y=0;knob.style.transform=''};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function press(el,dn,up){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('on');dn()});['pointerup','pointercancel'].forEach(k=>el.addEventListener(k,()=>{el.classList.remove('on');up()}))}
function aimY(){return H/2+input.y*55}
function switchP(){const l=P.filter(p=>p.team===0&&!p.gk).sort((a,b)=>dist(a,ball)-dist(b,ball));ctrl=(l[0]===ctrl?l[1]:l[0])||ctrl}
function passAct(){if(state!=='play')return;if(holder&&holder.team===0)doPass(holder);else switchP()}
function shootDown(){charge=performance.now()}
function chargeUI(){const b=$('shoot');if(charge>0){const pw=Math.min(1,(performance.now()-charge)/1000);b.style.background='conic-gradient(#ffe14a '+(pw*360)+'deg,#ff8a2a 0)';
 if(ctrl&&P){const sx=(ctrl.x-cam.x)*1.3+W/2,sy=(ctrl.y-cam.y)*1.3+H/2-58;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(sx-32,sy,64,9);g.fillStyle=pw<.5?'#c8f169':pw<.85?'#ffd23a':'#ff4a2a';g.fillRect(sx-30,sy+2,60*pw,5)}}else if(b.style.background)b.style.background=''}
function shootUp(){if(charge>0&&holder&&holder.team===0&&state==='play'){const pw=Math.min(1,(performance.now()-charge)/1000);doShot(holder,Math.max(.15,pw),aimY())}charge=-1}
press($('pass'),passAct,()=>{});press($('shoot'),shootDown,shootUp);press($('run'),()=>input.run=true,()=>input.run=false);
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.key.length===1?e.key.toLowerCase():e.key]=true;
  if(e.key==='x'||e.key==='X')passAct();if(e.code==='Space'){e.preventDefault();shootDown()}});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;if(e.code==='Space')shootUp()});
$('go').onclick=start;
ball={x:W/2,y:H/2,vx:0,vy:0};requestAnimationFrame(loop);
</script>
</body>
</html>
